name: Build desktop downloads

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - app-directory: desktop_downloader
            executable: SmartDownloader
            platform: Windows
            runner: windows-latest
            data-separator: ';'
          - app-directory: desktop_downloader_v11
            executable: SmartDownloader11
            platform: Windows
            runner: windows-latest
            data-separator: ';'
          - app-directory: desktop_downloader_v12
            executable: SmartDownloader12
            platform: Windows
            runner: windows-latest
            data-separator: ';'
          - app-directory: desktop_downloader_v12
            executable: SmartDownloader12
            platform: Linux
            runner: ubuntu-22.04
            data-separator: ':'
          - app-directory: desktop_downloader_v13
            executable: SmartDownloader13
            platform: Windows
            runner: windows-latest
            data-separator: ';'
            media-player-import: --hidden-import vlc
          - app-directory: desktop_downloader_v13
            executable: SmartDownloader13
            platform: Linux
            runner: ubuntu-22.04
            data-separator: ':'
            media-player-import: --hidden-import vlc
    defaults:
      run:
        working-directory: ${{ matrix.app-directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.app-directory }}/requirements.txt
      - name: Install Linux display and ZIP utilities
        if: matrix.platform == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-tk xvfb zip
      - name: Install app and packaging dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check pyinstaller
      - name: Download verified VLC runtime for portable Windows player
        if: matrix.app-directory == 'desktop_downloader_v13' && matrix.platform == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "vlc-3.0.23-win64.zip"
          $uri = "https://mirror.del.albony.in/videolan-ftp/vlc/3.0.23/win64/vlc-3.0.23-win64.zip"
          Invoke-WebRequest -Uri $uri -OutFile $archive
          $expectedHash = "992d19dbd0b8a7cde9167d2f7780b1ef6f92acc8a71acfa736101a21f35181e1"
          $actualHash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "The downloaded VLC runtime did not match VideoLAN's published SHA-256."
          }
          $extractDirectory = Join-Path $env:RUNNER_TEMP "vlc-extracted"
          Expand-Archive -Path $archive -DestinationPath $extractDirectory
          $vlcSource = Join-Path $extractDirectory "vlc-3.0.23"
          $vlcRuntime = Join-Path $env:RUNNER_TEMP "SmartDownloader13-VLC"
          if (-not (Test-Path (Join-Path $vlcSource "libvlc.dll")) -or
              -not (Test-Path (Join-Path $vlcSource "plugins"))) {
            throw "The downloaded VLC archive is missing its runtime files."
          }
          New-Item -ItemType Directory -Path $vlcRuntime | Out-Null
          Get-ChildItem -LiteralPath $vlcSource -Force |
            Copy-Item -Destination $vlcRuntime -Recurse
      - name: Run application tests
        run: python -m unittest discover -s tests -v
      - name: Build standalone executable
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name "${{ matrix.executable }}"
          --paths .
          --hidden-import app
          ${{ matrix.media-player-import }}
          --add-data "mobile.html${{ matrix.data-separator }}."
          --collect-all yt_dlp
          --collect-submodules plugins
          launch.py
      - name: Verify packaged GUI initializes
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: |
          $supportsSmokeTest = "${{ matrix.app-directory }}" -eq "desktop_downloader_v12" -or
            "${{ matrix.app-directory }}" -eq "desktop_downloader_v13"
          $arguments = @()
          if ($supportsSmokeTest) {
            $arguments = @("--smoke-test")
          }
          $process = Start-Process `
            -FilePath "dist\${{ matrix.executable }}.exe" `
            -ArgumentList $arguments -PassThru
          $deadline = (Get-Date).AddSeconds(60)
          if ($supportsSmokeTest) {
            do {
              Start-Sleep -Seconds 1
              $process.Refresh()
            } until ($process.HasExited -or (Get-Date) -ge $deadline)
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id
              throw "Packaged app GUI initialization timed out."
            }
            if ($process.ExitCode -ne 0) {
              throw "Packaged app GUI initialization failed with code $($process.ExitCode)."
            }
          } else {
            do {
              Start-Sleep -Seconds 1
              $process.Refresh()
            } until ($process.HasExited -or $process.MainWindowHandle -ne 0 -or (Get-Date) -ge $deadline)
            if ($process.HasExited -or $process.MainWindowHandle -eq 0) {
              if (-not $process.HasExited) {
                Stop-Process -Id $process.Id
              }
              throw "Packaged app did not open a visible window."
            }
            Stop-Process -Id $process.Id
          }
          if ("${{ matrix.app-directory }}" -eq "desktop_downloader_v12" -or
              "${{ matrix.app-directory }}" -eq "desktop_downloader_v13") {
            $cliProcess = Start-Process `
              -FilePath "dist\${{ matrix.executable }}.exe" `
              -ArgumentList "--cli --help" -Wait -PassThru
            if ($cliProcess.ExitCode -ne 0) {
              throw "Packaged command-line interface failed with code $($cliProcess.ExitCode)."
            }
          }
      - name: Verify packaged Linux GUI initializes
        if: matrix.platform == 'Linux'
        run: timeout 60s xvfb-run --auto-servernum dist/${{ matrix.executable }} --smoke-test
      - name: Verify packaged Linux command-line interface
        if: matrix.platform == 'Linux'
        run: dist/${{ matrix.executable }} --cli --help
      - name: Verify packaged Windows REST API
        if: matrix.platform == 'Windows' && (matrix.app-directory == 'desktop_downloader_v12' || matrix.app-directory == 'desktop_downloader_v13')
        shell: pwsh
        run: |
          $previousHost = $env:SMART_DOWNLOADER_API_HOST
          $previousPort = $env:SMART_DOWNLOADER_API_PORT
          $process = $null
          $apiLog = Join-Path $env:RUNNER_TEMP "${{ matrix.app-directory }}-api-stderr.log"
          try {
            $env:SMART_DOWNLOADER_API_HOST = "127.0.0.1"
            $env:SMART_DOWNLOADER_API_PORT = "18765"
            $process = Start-Process `
              -FilePath "dist\${{ matrix.executable }}.exe" `
              -ArgumentList "--api" -PassThru `
              -RedirectStandardError $apiLog
            $deadline = (Get-Date).AddSeconds(180)
            $response = $null
            do {
              $process.Refresh()
              if ($process.HasExited) {
                throw "Packaged REST API exited with code $($process.ExitCode)."
              }
              try {
                $response = Invoke-WebRequest `
                  -UseBasicParsing `
                  -Uri "http://127.0.0.1:18765/mobile" `
                  -TimeoutSec 2
              } catch {
                Start-Sleep -Milliseconds 500
              }
            } until ($response -or (Get-Date) -ge $deadline)
            if (-not $response -or $response.StatusCode -ne 200) {
              throw "Packaged REST API did not serve /mobile before timing out. Log: $apiLog"
            }
          } finally {
            if ($process) {
              $process.Refresh()
              if (-not $process.HasExited) {
                $processIds = @([int]$process.Id)
                $pendingProcessIds = $processIds
                while ($pendingProcessIds.Count -gt 0) {
                  $childProcessIds = @(
                    Get-CimInstance Win32_Process |
                      Where-Object {
                        $pendingProcessIds -contains [int]$_.ParentProcessId -and
                        $processIds -notcontains [int]$_.ProcessId
                      } |
                      Select-Object -ExpandProperty ProcessId
                  )
                  $processIds += $childProcessIds
                  $pendingProcessIds = $childProcessIds
                }
                for ($index = $processIds.Count - 1; $index -ge 0; $index--) {
                  Stop-Process -Id $processIds[$index] -Force -ErrorAction SilentlyContinue
                }
                $process.WaitForExit(10000) | Out-Null
              }
            }
            if ($null -eq $previousHost) {
              Remove-Item Env:\SMART_DOWNLOADER_API_HOST -ErrorAction SilentlyContinue
            } else {
              $env:SMART_DOWNLOADER_API_HOST = $previousHost
            }
            if ($null -eq $previousPort) {
              Remove-Item Env:\SMART_DOWNLOADER_API_PORT -ErrorAction SilentlyContinue
            } else {
              $env:SMART_DOWNLOADER_API_PORT = $previousPort
            }
          }
      - name: Package portable Windows ZIP
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: |
          $packageName = "${{ matrix.executable }}-${{ matrix.platform }}"
          $packageDirectory = Join-Path $env:RUNNER_TEMP $packageName
          New-Item -ItemType Directory -Path $packageDirectory | Out-Null
          Copy-Item "dist\${{ matrix.executable }}.exe" $packageDirectory
          Copy-Item README.md $packageDirectory
          $setupLines = @(
            "Extract this ZIP file, then double-click ${{ matrix.executable }}.exe."
            "Python and the app's Python packages are bundled; no Python installation is required."
            "Optional external tools are listed in README.md."
          )
          if ("${{ matrix.app-directory }}" -eq "desktop_downloader_v12" -or
              "${{ matrix.app-directory }}" -eq "desktop_downloader_v13") {
            Copy-Item browser_extension $packageDirectory -Recurse
            Copy-Item plugins $packageDirectory -Recurse
            $setupLines += @(
              "Use .\${{ matrix.executable }}.exe --cli <arguments> for CLI downloads."
              "Use .\${{ matrix.executable }}.exe --api in a terminal for the REST API."
              "Load the included browser_extension folder as an unpacked browser extension."
              "Add trusted Python plugin files to the included plugins folder."
            )
          }
          if ("${{ matrix.app-directory }}" -eq "desktop_downloader_v13") {
            $vlcDestination = Join-Path $packageDirectory "VLC"
            New-Item -ItemType Directory -Path $vlcDestination | Out-Null
            Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP "SmartDownloader13-VLC") -Force |
              Copy-Item -Destination $vlcDestination -Recurse
            $setupLines += @(
              "Smart VLC includes the VideoLAN VLC 3.0.23 runtime and license files in the VLC folder."
              "No separate VLC installation is required for in-app audio/video playback."
            )
          }
          $setupPath = Join-Path $packageDirectory "PORTABLE-SETUP.txt"
          $setupLines | Set-Content -Path $setupPath -Encoding utf8
          $packageZip = Join-Path $env:RUNNER_TEMP "$packageName.zip"
          Compress-Archive -Path "$packageDirectory\*" -DestinationPath $packageZip
          if ("${{ matrix.app-directory }}" -eq "desktop_downloader_v13") {
            & (Join-Path $packageDirectory "${{ matrix.executable }}.exe") --vlc-smoke-test
            if ($LASTEXITCODE -ne 0) {
              throw "The portable VLC runtime failed its packaged smoke test."
            }
          }
      - name: Package portable Linux ZIP
        if: matrix.platform == 'Linux'
        shell: bash
        run: |
          package_name="${{ matrix.executable }}-${{ matrix.platform }}"
          package_directory="$RUNNER_TEMP/$package_name"
          mkdir -p "$package_directory"
          cp "dist/${{ matrix.executable }}" "$package_directory/"
          cp README.md "$package_directory/"
          cp -R browser_extension "$package_directory/"
          cp -R plugins "$package_directory/"
          cat > "$package_directory/PORTABLE-SETUP.txt" <<EOF
          Extract this ZIP file and run ./${{ matrix.executable }}.
          Python and the app's Python packages are bundled; no Python installation is required.
          Use ./${{ matrix.executable }} --cli <arguments> for CLI downloads.
          Use ./${{ matrix.executable }} --api in a terminal for the REST API.
          Load the included browser_extension folder as an unpacked browser extension.
          Add trusted Python plugin files to the included plugins folder.
          Optional external tools are listed in README.md.
          EOF
          cd "$RUNNER_TEMP"
          zip -qr "$package_name.zip" "$package_name"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.executable }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/${{ matrix.executable }}-${{ matrix.platform }}.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Publish portable ZIP files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $assets = Get-ChildItem -Path release-artifacts -Filter "*.zip" -Recurse |
            ForEach-Object { $_.FullName }
          if ($assets.Count -ne 6) {
            throw "Expected six portable ZIP files, found $($assets.Count)."
          }
          gh release create "$env:GITHUB_REF_NAME" $assets `
            --repo "${{ github.repository }}" --verify-tag --generate-notes
