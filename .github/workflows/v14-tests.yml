name: v14 regression tests

on:
  pull_request:
    paths:
      - "desktop_downloader_v14/**"
      - ".github/workflows/v14-tests.yml"
  push:
    branches: [main]
    paths:
      - "desktop_downloader_v14/**"
      - ".github/workflows/v14-tests.yml"

jobs:
  v14-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    defaults:
      run:
        working-directory: desktop_downloader_v14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: desktop_downloader_v14/requirements.txt
      - name: Install v14 dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile v14 Python modules
        run: python -m compileall -q .
      - name: Run v14 regression suite
        run: python -m unittest discover -s tests -v
