name: v14 live site check

# Downloads real public videos with the app's own engine on GitHub's servers,
# so nothing is downloaded to your computer. It runs weekly automatically;
# you can also start it manually from Actions > "v14 live site check".
# The result table appears on the run's Summary page.

on:
  schedule:
    - cron: "17 5 * * 1"  # Weekly Monday at 05:17 UTC
  workflow_dispatch:
    inputs:
      urls:
        description: "Optional: your own links to test, one per line (leave empty for the built-in list)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop_downloader_v14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: desktop_downloader_v14/requirements.txt
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install app dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Download real videos
        env:
          INPUT_URLS: ${{ github.event.inputs.urls }}
        run: |
          set -f   # keep "?" and "*" in links from being treated as file patterns
          if [ -n "$INPUT_URLS" ]; then
            # shellcheck disable=SC2086
            python live_check.py $(printf '%s' "$INPUT_URLS" | tr '\n' ' ')
          else
            python live_check.py
          fi
